<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Exemplo de Formulário</h1>
    </header>

    <div class="linha-roxa"></div>

    <main>
        <div class="formulario">
            <form action="cadastro.php" method="get" autocomplete="on">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <p>
                        <label for="inome">Nome:</label>
                        <input type="text" name="nome" id="inome" minlength="3" maxlength="15" required>
                    </p>
                    <p>
                        <label for="iemail">E-mail:</label>
                        <input type="email" name="email" id="iemail" autocomplete="email" required pattern="\w+@\w+\.\w+">
                    </p>
                    <p>
                        <label for="itel">Telefone:</label>
                        <input type="tel" name="tel" id="itel" autocomplete="tel" required pattern="\(\d{2}\)\d{4,5}-\d{4}$" placeholder="Ex: (xx)xxxxx-xxxx">
                    </p>
                </fieldset>
                     <p class="botoes">
                        <input type="submit" value="Enviar">
                        <input type="reset" value="Limpar">
                    </p>
            </form>
        </div>
    </main>
    <footer>

    </footer>

</body>
</html>
